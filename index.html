<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Zas — el gasto, apuntado de un toque</title>
<meta name="description" content="Pagas con el móvil y Zas te pregunta solo la categoría. Nada sale de tu teléfono.">
<meta name="theme-color" content="#f4f4f7">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Zas">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" href="icons/icon-192.png" type="image/png">
<link rel="stylesheet" href="styles.css">
</head>
<body>

<!-- ===================================================================
     Sprite de iconos. Un solo SVG oculto del que tiran todos los <use>:
     así el icono de una categoría no cuesta una petición más.
     =================================================================== -->
<svg class="sprite" aria-hidden="true" focusable="false"
     xmlns="http://www.w3.org/2000/svg"
     fill="none" stroke="currentColor" stroke-width="1.7"
     stroke-linecap="round" stroke-linejoin="round">
  <defs>
    <!-- Categorías -->
    <symbol id="i-super" viewBox="0 0 24 24"><path d="M3 4h2l2.3 10.4a2 2 0 0 0 2 1.6h7.4a2 2 0 0 0 2-1.6L20.5 8H6"/><circle cx="10" cy="20" r="1.4"/><circle cx="17" cy="20" r="1.4"/></symbol>
    <symbol id="i-comida" viewBox="0 0 24 24"><path d="M6 3v5a3 3 0 0 0 6 0V3M9 11v10M18 3v18M18 3c-2 1-3 3-3 6s1 3 3 3"/></symbol>
    <symbol id="i-cafe" viewBox="0 0 24 24"><path d="M4 8h12v5a5 5 0 0 1-5 5H9a5 5 0 0 1-5-5zM16 9h1.5a2.5 2.5 0 0 1 0 5H16M3 21h14M7 2v2.5M11 2v2.5"/></symbol>
    <symbol id="i-copas" viewBox="0 0 24 24"><path d="M4 4h16l-8 8zM12 12v6M8 21h8"/></symbol>
    <symbol id="i-transporte" viewBox="0 0 24 24"><rect x="4" y="3" width="16" height="15" rx="2.5"/><path d="M4 11h16M8 21l1-3M16 21l-1-3"/><circle cx="8.5" cy="14.5" r="1.1"/><circle cx="15.5" cy="14.5" r="1.1"/></symbol>
    <symbol id="i-gasolina" viewBox="0 0 24 24"><path d="M4 21V5a2 2 0 0 1 2-2h5a2 2 0 0 1 2 2v16M3 21h12M4 10h9M13 8h3a2 2 0 0 1 2 2v6a1.5 1.5 0 0 0 3 0V9.5L18.5 7"/></symbol>
    <symbol id="i-coche" viewBox="0 0 24 24"><path d="M4 17v-4.5L6 7h12l2 5.5V17M3 17h18"/><circle cx="7.5" cy="17.5" r="1.6"/><circle cx="16.5" cy="17.5" r="1.6"/><path d="M5 12.5h14"/></symbol>
    <symbol id="i-casa" viewBox="0 0 24 24"><path d="M3 11l9-7 9 7M5.5 9.7V20h13V9.7M10 20v-5.5h4V20"/></symbol>
    <symbol id="i-luz" viewBox="0 0 24 24"><path d="M13 2 4 14h6.5L10 22l9-12h-6.5z"/></symbol>
    <symbol id="i-compras" viewBox="0 0 24 24"><path d="M5 7h14l-1.2 13H6.2zM9 10V6.5a3 3 0 0 1 6 0V10"/></symbol>
    <symbol id="i-ropa" viewBox="0 0 24 24"><path d="M8.5 3 3.5 6l2 4 2-1v11h9V9l2 1 2-4-5-3"/><path d="M8.5 3a3.5 3.5 0 0 0 7 0"/></symbol>
    <symbol id="i-tech" viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="11" rx="1.5"/><path d="M2 19.5h20"/></symbol>
    <symbol id="i-ocio" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M8 4v16M16 4v16M3 9h5M3 15h5M16 9h5M16 15h5"/></symbol>
    <symbol id="i-deporte" viewBox="0 0 24 24"><path d="M6.5 6.5v11M3.5 9v6M17.5 6.5v11M20.5 9v6M6.5 12h11"/></symbol>
    <symbol id="i-salud" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 7.5v9M7.5 12h9"/></symbol>
    <symbol id="i-belleza" viewBox="0 0 24 24"><path d="M11 2.5l2 5.5 5.5 2-5.5 2-2 5.5-2-5.5L3.5 10l5.5-2z"/><path d="M18.5 14.5l.9 2.1 2.1.9-2.1.9-.9 2.1-.9-2.1-2.1-.9 2.1-.9z"/></symbol>
    <symbol id="i-suscripcion" viewBox="0 0 24 24"><path d="M3.5 9A5.5 5.5 0 0 1 9 3.5h9M15 1l3 2.5L15 6M20.5 15a5.5 5.5 0 0 1-5.5 5.5H6M9 23l-3-2.5L9 18"/></symbol>
    <symbol id="i-viaje" viewBox="0 0 24 24"><path d="M2.5 12.5 21.5 6l-6.5 13-2.6-7.2z"/></symbol>
    <symbol id="i-regalo" viewBox="0 0 24 24"><path d="M3 10h18v3.2H3zM5 13.2V21h14v-7.8M12 10v11"/><path d="M12 10S9.4 10 8.4 9A2 2 0 0 1 11 6.2c1 1 1 3.8 1 3.8zM12 10s2.6 0 3.6-1A2 2 0 0 0 13 6.2c-1 1-1 3.8-1 3.8z"/></symbol>
    <symbol id="i-mascota" viewBox="0 0 24 24"><path d="M12 13.5c-2.6 0-4.6 1.9-4.6 3.9 0 1.9 1.6 2.9 4.6 2.9s4.6-1 4.6-2.9c0-2-2-3.9-4.6-3.9z"/><ellipse cx="7" cy="9.5" rx="1.7" ry="2.2"/><ellipse cx="17" cy="9.5" rx="1.7" ry="2.2"/><ellipse cx="11" cy="6" rx="1.6" ry="2.1"/><ellipse cx="15.6" cy="5.4" rx="1.4" ry="1.9"/></symbol>
    <symbol id="i-estudios" viewBox="0 0 24 24"><path d="M2.5 9 12 4.3 21.5 9 12 13.7zM6.5 11.2V17c0 1.5 2.5 2.8 5.5 2.8s5.5-1.3 5.5-2.8v-5.8"/></symbol>
    <symbol id="i-otros" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><circle cx="8.2" cy="12" r=".9" fill="currentColor" stroke="none"/><circle cx="12" cy="12" r=".9" fill="currentColor" stroke="none"/><circle cx="15.8" cy="12" r=".9" fill="currentColor" stroke="none"/></symbol>

    <!-- Cuentas -->
    <symbol id="i-tarjeta" viewBox="0 0 24 24"><rect x="2.5" y="5" width="19" height="14" rx="2.5"/><path d="M2.5 9.8h19M6 15h4"/></symbol>
    <symbol id="i-banco" viewBox="0 0 24 24"><path d="M3 10h18M4.5 10V8.8L12 4.2l7.5 4.6V10M6.5 10.5v7.5M10 10.5v7.5M14 10.5v7.5M17.5 10.5v7.5M3 20.5h18"/></symbol>
    <symbol id="i-efectivo" viewBox="0 0 24 24"><rect x="2.5" y="6.5" width="19" height="11" rx="1.6"/><circle cx="12" cy="12" r="2.6"/><path d="M6 12h.01M18 12h.01"/></symbol>

    <!-- Interfaz -->
    <symbol id="i-rayo" viewBox="0 0 24 24"><path d="M13 2 4 14h6.5L10 22l9-12h-6.5z"/></symbol>
    <symbol id="i-mas" viewBox="0 0 24 24"><path d="M12 5.5v13M5.5 12h13"/></symbol>
    <symbol id="i-lista" viewBox="0 0 24 24"><path d="M8.5 6.5h12M8.5 12h12M8.5 17.5h12M3.6 6.5h.01M3.6 12h.01M3.6 17.5h.01"/></symbol>
    <symbol id="i-grafico" viewBox="0 0 24 24"><path d="M3 20.5h18M7.5 20.5v-6M12 20.5v-11M16.5 20.5v-8"/></symbol>
    <symbol id="i-ajustes" viewBox="0 0 24 24"><path d="M4 6.5h8M16 6.5h4M4 12h4M12 12h8M4 17.5h8M16 17.5h4"/><circle cx="14" cy="6.5" r="2"/><circle cx="10" cy="12" r="2"/><circle cx="14" cy="17.5" r="2"/></symbol>
    <symbol id="i-cerrar" viewBox="0 0 24 24"><path d="M6.5 6.5l11 11M17.5 6.5l-11 11"/></symbol>
    <symbol id="i-cheque" viewBox="0 0 24 24"><path d="M5 12.5l4.5 4.5L19 7.5"/></symbol>
    <symbol id="i-atras" viewBox="0 0 24 24"><path d="M14.5 5.5 8 12l6.5 6.5"/></symbol>
    <symbol id="i-adelante" viewBox="0 0 24 24"><path d="M9.5 5.5 16 12l-6.5 6.5"/></symbol>
    <symbol id="i-abajo" viewBox="0 0 24 24"><path d="M6 9.5l6 6 6-6"/></symbol>
    <symbol id="i-lapiz" viewBox="0 0 24 24"><path d="M4 20h4.2L19.4 8.8a2.9 2.9 0 0 0-4.2-4.2L4 15.8z"/></symbol>
    <symbol id="i-papelera" viewBox="0 0 24 24"><path d="M4 6.8h16M9.5 6.8V4.5h5v2.3M6.3 6.8 7.3 20h9.4l1-13.2M10 11v5.5M14 11v5.5"/></symbol>
    <symbol id="i-info" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 11v5.5M12 7.8h.01"/></symbol>
    <symbol id="i-descargar" viewBox="0 0 24 24"><path d="M12 4v11M8 11.5l4 4 4-4M5 20h14"/></symbol>
    <symbol id="i-subir" viewBox="0 0 24 24"><path d="M12 20V9M8 12.5l4-4 4 4M5 4.5h14"/></symbol>
    <symbol id="i-reloj" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 7v5.3l3.2 2"/></symbol>
    <symbol id="i-aviso" viewBox="0 0 24 24"><path d="M12 3.5 21 19.5H3z"/><path d="M12 9.5v4.5M12 17h.01"/></symbol>
  </defs>
</svg>

<div class="app">

  <!-- ============================ Movimientos ============================ -->
  <section class="pantalla" id="p-movimientos" data-pantalla="movimientos">
    <header class="cabecera">
      <div class="mes-nav">
        <button type="button" class="icono-btn" data-mes="-1" aria-label="Mes anterior">
          <svg class="icono" aria-hidden="true"><use href="#i-atras"/></svg>
        </button>
        <h1 class="mes-nombre" id="mov-mes">este mes</h1>
        <button type="button" class="icono-btn" data-mes="1" aria-label="Mes siguiente">
          <svg class="icono" aria-hidden="true"><use href="#i-adelante"/></svg>
        </button>
      </div>
      <p class="cabecera-total"><span id="mov-total">0,00 €</span></p>
      <p class="cabecera-pie" id="mov-pie"></p>
    </header>

    <div class="contenido" id="mov-lista"></div>
  </section>

  <!-- ============================== Resumen ============================== -->
  <section class="pantalla" id="p-resumen" data-pantalla="resumen" hidden>
    <header class="cabecera">
      <div class="mes-nav">
        <button type="button" class="icono-btn" data-mes="-1" aria-label="Mes anterior">
          <svg class="icono" aria-hidden="true"><use href="#i-atras"/></svg>
        </button>
        <h1 class="mes-nombre" id="res-mes">este mes</h1>
        <button type="button" class="icono-btn" data-mes="1" aria-label="Mes siguiente">
          <svg class="icono" aria-hidden="true"><use href="#i-adelante"/></svg>
        </button>
      </div>
      <p class="cabecera-total"><span id="res-total">0,00 €</span></p>
      <p class="cabecera-pie" id="res-comparacion"></p>
    </header>

    <div class="contenido" id="res-cuerpo"></div>
  </section>

  <!-- ============================== Ajustes ============================== -->
  <section class="pantalla" id="p-ajustes" data-pantalla="ajustes" hidden>
    <header class="cabecera cabecera--simple">
      <h1 class="mes-nombre">Ajustes</h1>
    </header>
    <div class="contenido" id="aj-cuerpo"></div>
  </section>

  <!-- ============================ Barra de pestañas ====================== -->
  <nav class="tabbar" aria-label="Secciones">
    <button type="button" class="tab tab--activa" data-ir="movimientos" aria-current="page">
      <svg class="icono" aria-hidden="true"><use href="#i-lista"/></svg>
      <span>Gastos</span>
    </button>
    <button type="button" class="tab" data-ir="resumen">
      <svg class="icono" aria-hidden="true"><use href="#i-grafico"/></svg>
      <span>Resumen</span>
    </button>
    <button type="button" class="tab" data-ir="ajustes">
      <svg class="icono" aria-hidden="true"><use href="#i-ajustes"/></svg>
      <span>Ajustes</span>
    </button>
  </nav>

  <button type="button" class="fab" id="btn-nuevo" aria-label="Apuntar un gasto a mano">
    <svg class="icono" aria-hidden="true"><use href="#i-mas"/></svg>
  </button>
</div>

<!-- ===================================================================
     La ventana del pago. Es lo único que ves cuando el Atajo te trae un
     cobro: el importe grande, el comercio, y dos filas que tocar.
     =================================================================== -->
<dialog class="hoja hoja--pago" id="hoja-pago" aria-labelledby="pago-comercio">
  <div class="hoja-panel cristal" id="pago-panel">
    <div class="hoja-tirador"><span></span></div>

    <p class="pago-etiqueta">
      <svg class="icono icono--sm" aria-hidden="true"><use href="#i-rayo"/></svg>
      <span id="pago-etiqueta-texto">Pago detectado</span>
    </p>

    <div class="pago-cifra">
      <button type="button" class="pago-importe" id="pago-importe" aria-label="Cambiar el importe">
        <span class="pago-entero" id="pago-entero">0</span><span class="pago-decimales" id="pago-decimales">,00</span><span class="pago-moneda">€</span>
      </button>
      <input type="text" inputmode="decimal" class="pago-importe-campo" id="pago-importe-campo"
             aria-label="Importe en euros" hidden>
    </div>

    <button type="button" class="pago-comercio" id="pago-comercio">Sin comercio</button>
    <input type="text" class="pago-comercio-campo" id="pago-comercio-campo"
           aria-label="Nombre del comercio" autocomplete="off" hidden>

    <p class="pago-cuando" id="pago-cuando"></p>

    <p class="pago-memoria" id="pago-memoria" hidden>
      <svg class="icono icono--sm" aria-hidden="true"><use href="#i-reloj"/></svg>
      <span id="pago-memoria-texto"></span>
    </p>

    <div class="pago-seccion">
      <h2 class="pago-titulo">En qué</h2>
      <div class="chips chips--rejilla" id="pago-categorias" role="radiogroup" aria-label="Categoría"></div>
    </div>

    <div class="pago-seccion">
      <h2 class="pago-titulo">Con qué</h2>
      <div class="chips" id="pago-cuentas" role="radiogroup" aria-label="Cuenta o tarjeta"></div>
    </div>

    <footer class="pago-pie">
      <button type="button" class="btn btn--fantasma" id="pago-descartar">Descartar</button>
      <button type="button" class="btn btn--primario btn--grande" id="pago-guardar">
        <span id="pago-guardar-texto">Guardar</span>
      </button>
    </footer>
  </div>
</dialog>

<!-- Alta y edición a mano -->
<dialog class="hoja" id="hoja-gasto" aria-labelledby="gasto-titulo">
  <form class="hoja-panel" id="gasto-form" method="dialog">
    <div class="hoja-tirador"><span></span></div>
    <h2 class="hoja-titulo" id="gasto-titulo">Nuevo gasto</h2>

    <div class="campo">
      <label for="gasto-importe">Importe</label>
      <input type="text" inputmode="decimal" id="gasto-importe" placeholder="0,00" required autocomplete="off">
    </div>

    <div class="campo">
      <label for="gasto-comercio">Comercio</label>
      <input type="text" id="gasto-comercio" placeholder="Mercadona" autocomplete="off" list="lista-comercios">
      <datalist id="lista-comercios"></datalist>
    </div>

    <div class="campo">
      <label for="gasto-fecha">Fecha</label>
      <input type="date" id="gasto-fecha" required>
    </div>

    <div class="campo">
      <span class="campo-etiqueta">En qué</span>
      <div class="chips chips--rejilla" id="gasto-categorias" role="radiogroup" aria-label="Categoría"></div>
    </div>

    <div class="campo">
      <span class="campo-etiqueta">Con qué</span>
      <div class="chips" id="gasto-cuentas" role="radiogroup" aria-label="Cuenta o tarjeta"></div>
    </div>

    <footer class="hoja-pie">
      <button type="button" class="btn btn--peligro" id="gasto-borrar" hidden>Borrar</button>
      <button type="button" class="btn btn--fantasma" data-cerrar>Cancelar</button>
      <button type="submit" class="btn btn--primario">Guardar</button>
    </footer>
  </form>
</dialog>

<!-- Categoría -->
<dialog class="hoja" id="hoja-categoria" aria-labelledby="cat-titulo">
  <form class="hoja-panel" id="cat-form" method="dialog">
    <div class="hoja-tirador"><span></span></div>
    <h2 class="hoja-titulo" id="cat-titulo">Nueva categoría</h2>

    <div class="campo">
      <label for="cat-nombre">Nombre</label>
      <input type="text" id="cat-nombre" maxlength="24" required autocomplete="off">
    </div>

    <div class="campo">
      <label for="cat-tope">Tope al mes <span class="campo-pista">opcional</span></label>
      <input type="text" inputmode="decimal" id="cat-tope" placeholder="Sin tope" autocomplete="off">
    </div>

    <div class="campo">
      <span class="campo-etiqueta">Icono</span>
      <div class="rejilla-iconos" id="cat-iconos" role="radiogroup" aria-label="Icono"></div>
    </div>

    <footer class="hoja-pie">
      <button type="button" class="btn btn--peligro" id="cat-borrar" hidden>Borrar</button>
      <button type="button" class="btn btn--fantasma" data-cerrar>Cancelar</button>
      <button type="submit" class="btn btn--primario">Guardar</button>
    </footer>
  </form>
</dialog>

<!-- Cuenta o tarjeta -->
<dialog class="hoja" id="hoja-cuenta" aria-labelledby="cta-titulo">
  <form class="hoja-panel" id="cta-form" method="dialog">
    <div class="hoja-tirador"><span></span></div>
    <h2 class="hoja-titulo" id="cta-titulo">Nueva tarjeta</h2>

    <div class="campo">
      <label for="cta-nombre">Nombre</label>
      <input type="text" id="cta-nombre" maxlength="24" required autocomplete="off" placeholder="Visa del banco">
    </div>

    <div class="campo">
      <label for="cta-ultimos">Últimos 4 números <span class="campo-pista">ayudan a reconocerla</span></label>
      <input type="text" inputmode="numeric" id="cta-ultimos" maxlength="4" placeholder="4242" autocomplete="off">
    </div>

    <div class="campo">
      <span class="campo-etiqueta">Tipo</span>
      <div class="chips" id="cta-tipos" role="radiogroup" aria-label="Tipo de cuenta"></div>
    </div>

    <footer class="hoja-pie">
      <button type="button" class="btn btn--peligro" id="cta-borrar" hidden>Borrar</button>
      <button type="button" class="btn btn--fantasma" data-cerrar>Cancelar</button>
      <button type="submit" class="btn btn--primario">Guardar</button>
    </footer>
  </form>
</dialog>

<!-- Cómo montar el Atajo -->
<dialog class="hoja hoja--alta" id="hoja-atajo" aria-labelledby="atajo-titulo">
  <div class="hoja-panel">
    <div class="hoja-tirador"><span></span></div>
    <h2 class="hoja-titulo" id="atajo-titulo">Que se apunte solo</h2>
    <div class="prosa" id="atajo-cuerpo"></div>
    <footer class="hoja-pie">
      <button type="button" class="btn btn--primario" data-cerrar>Entendido</button>
    </footer>
  </div>
</dialog>

<div id="avisos" class="avisos" aria-live="polite" aria-atomic="false"></div>

<script type="module" src="app.js"></script>
</body>
</html>
